<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4158D0"/>
      <stop offset="50%" stop-color="#C850C0"/>
      <stop offset="100%" stop-color="#FFCC70"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Photo frame (rounded rect outline) -->
  <rect x="100" y="130" width="312" height="252" rx="28" fill="none" stroke="white" stroke-width="24"/>
  <!-- Mountain/landscape inside -->
  <polygon points="140,340 220,250 270,290 340,210 372,340" fill="rgba(255,255,255,0.35)"/>
  <!-- Sun circle -->
  <circle cx="180" cy="195" r="28" fill="rgba(255,255,255,0.5)"/>
  <!-- Shuffle arrows at bottom -->
  <line x1="190" y1="420" x2="322" y2="420" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <polyline points="298,400 322,420 298,440" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
